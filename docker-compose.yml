services:
  websrt:
    container_name: websrt
    build:
      context: ./codigo-fonte/cliente
      dockerfile: Dockerfile
      args:
        - WWW_DATA_USER=1001
        - WWW_DATA_GROUP=1001
        - ENVIRONMENT=${APP_ENV}
    expose:
      - "80"
      - "443"
    volumes:
      - ./codigo-fonte/cliente:/var/www/html
    ports:
      - "8088:80"
    networks:
      - srt-network
  phpsrt:
    container_name: phpsrt
    build:
      context: ./codigo-fonte/servico
      dockerfile: Dockerfile
    ports:
      - "8090:80"
    expose:
      - "9000"
    env_file:
      - ./codigo-fonte/servico/.env
    volumes:
      - ./codigo-fonte/servico:/var/www/html
    networks:
      - srt-network

networks:
  srt-network:
    driver: bridge

