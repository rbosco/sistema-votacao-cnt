version: '3.8'

services:
  servico:
    build:
      context: ./codigo-fonte/servico
      dockerfile: Dockerfile
    container_name: sistema-votacao-servico
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./codigo-fonte/servico:/var/www
    networks:
      - sistema-votacao
    depends_on:
      - sqlserver

  cliente:
    build:
      context: ./codigo-fonte/cliente
      dockerfile: Dockerfile
    container_name: sistema-votacao-cliente
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./codigo-fonte/cliente:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - sistema-votacao
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - servico

  nginx:
    image: nginx:alpine
    container_name: sistema-votacao-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./codigo-fonte/servico:/var/www
      - ./codigo-fonte/servico/docker/nginx:/etc/nginx/conf.d
    networks:
      - sistema-votacao
    depends_on:
      - servico

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sistema-votacao-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "SistemaVotacao@2024"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - sistema-votacao

networks:
  sistema-votacao:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local
